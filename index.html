<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="زياراتي">
<title>جدول الزيارات</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0a7a5a">
<style>
:root{--bg:#f5f6f8;--card:#fff;--tx:#1b1f24;--mut:#6b7380;--pr:#0a7a5a;--prt:#fff;--bd:#e2e5ea;--fx:#fff4d6;--dn:#e6f4ee;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121416;--card:#1c1f23;--tx:#eceef1;--mut:#9aa3ae;--pr:#2fbf91;--prt:#06231a;--bd:#2c3138;--fx:#3a3216;--dn:#17302a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121416;--card:#1c1f23;--tx:#eceef1;--mut:#9aa3ae;--pr:#2fbf91;--prt:#06231a;--bd:#2c3138;--fx:#3a3216;--dn:#17302a;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,"Segoe UI",Tahoma,Arial,sans-serif;font-size:16px;padding-bottom:80px}
.wrap{max-width:560px;margin:0 auto;padding:14px}
h1{font-size:20px;margin:6px 0 2px}
.sub{color:var(--mut);font-size:14px;margin-bottom:12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;margin-bottom:10px}
.card.fixed{background:var(--fx)}.card.done{background:var(--dn);opacity:.85}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.time{font-weight:700;color:var(--pr);min-width:56px}
.nm{font-weight:700}.ad{color:var(--mut);font-size:14px;margin:2px 0}
.tag{font-size:12px;background:var(--bg);border:1px solid var(--bd);border-radius:20px;padding:1px 8px;color:var(--mut)}
button,.btn{font:inherit;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;padding:9px 12px;text-decoration:none;cursor:pointer;display:inline-block}
.pri{background:var(--pr);color:var(--prt);border-color:var(--pr);font-weight:700}
.full{width:100%;margin-bottom:10px}
.sm{padding:6px 10px;font-size:14px}
input,textarea{font:inherit;width:100%;padding:10px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);margin-bottom:8px}
label{font-size:13px;color:var(--mut);display:block;margin-bottom:3px}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;border:0;border-radius:0;padding:14px 2px;font-size:14px;background:none;color:var(--mut)}
nav button.on{color:var(--pr);font-weight:700}
.empty{text-align:center;color:var(--mut);padding:24px 8px}
.days{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>
<div class="wrap" id="app"></div>
<nav>
<button id="t0" onclick="tab(0)">📅 اليوم</button>
<button id="t1" onclick="tab(1)">👥 العملاء</button>
<button id="t3" onclick="tab(3)">💰 المبيعات</button>
<button id="t2" onclick="tab(2)">⚙️ الإعدادات</button>
</nav>
<script>
var DAYS=['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
var S={customers:[],settings:{fixedName:'',fixedTime:'12:00',fixedDur:60,start:'09:00',max:7,visitDur:40},schedule:{date:'',ids:[]}};
var cur=0,editId=null,q='',pendLoc=null,locTried=false,doneId=null,pdfMsg='',acctId=null,entType=null,salesF='all',entPre=null,invMsg='',bkMsg='',entBlob=null,salesM='',editEntId=null,saving=false,stmtFrom='',stmtTo='';
try{var raw=localStorage.getItem('visits_v1');if(raw){var p=JSON.parse(raw);if(p&&p.customers)S=Object.assign(S,p);S.settings=Object.assign({fixedName:'',fixedTime:'12:00',fixedDur:60,start:'09:00',max:7,visitDur:40},S.settings)}}catch(e){}
S.settings=Object.assign({company:'Gusto Limited Company',agent:'ISLAM GAD',currency:'د.ك'},S.settings);S.log=S.log||{};S.ledger=S.ledger||[];
function lsSave(){try{localStorage.setItem('visits_v1',JSON.stringify(S))}catch(e){}}
function syText(){return '💾 البيانات محفوظة على جهازك'}
function setSy(){}
function save(){S.updatedAt=Date.now();lsSave()}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function ask(msg,ok,no){
  return new Promise(function(res){
    var d=document.createElement('div');d.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:100;display:flex;align-items:center;justify-content:center;padding:20px';
    var b=document.createElement('div');b.style.cssText='background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:14px;padding:16px;max-width:360px;width:100%;white-space:pre-line;line-height:1.6';
    var p=document.createElement('div');p.textContent=msg;p.style.marginBottom='14px';
    var r=document.createElement('div');r.className='row';
    function fin(v){d.remove();res(v)}
    var y=document.createElement('button');y.className='pri';y.textContent=ok||'موافق';y.onclick=function(){fin(true)};
    var n=document.createElement('button');n.textContent=no||'إلغاء';n.onclick=function(){fin(false)};
    r.appendChild(y);r.appendChild(n);b.appendChild(p);b.appendChild(r);d.appendChild(b);document.body.appendChild(d);
  });
}
var toastT=null;
function toast(m){
  var t=document.getElementById('toast');
  if(!t){t=document.createElement('div');t.id='toast';t.style.cssText='position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom,0px));background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:20px;z-index:101;font-size:15px;max-width:90%;text-align:center';document.body.appendChild(t)}
  t.textContent=m;t.style.display='block';clearTimeout(toastT);toastT=setTimeout(function(){t.style.display='none'},2500);
}
var idb=null;
function idbOpen(){return new Promise(function(res){if(idb)return res(idb);try{var r=indexedDB.open('visits_img',1);r.onupgradeneeded=function(){r.result.createObjectStore('img')};r.onsuccess=function(){idb=r.result;res(idb)};r.onerror=function(){res(null)}}catch(e){res(null)}})}
async function imgPut(id,b){var d=await idbOpen();if(!d)throw 0;return new Promise(function(res,rej){var t=d.transaction('img','readwrite');t.objectStore('img').put(b,id);t.oncomplete=res;t.onerror=rej})}
async function imgGet(id){var d=await idbOpen();if(!d)return null;return new Promise(function(res){var q=d.transaction('img').objectStore('img').get(id);q.onsuccess=function(){res(q.result||null)};q.onerror=function(){res(null)}})}
async function imgDel(id){var d=await idbOpen();if(!d)return;return new Promise(function(res){var t=d.transaction('img','readwrite');t.objectStore('img').delete(id);t.oncomplete=res;t.onerror=res})}
async function imgKeys(){var d=await idbOpen();if(!d)return [];return new Promise(function(res){var q=d.transaction('img').objectStore('img').getAllKeys();q.onsuccess=function(){res(q.result||[])};q.onerror=function(){res([])}})}
function blobToUrl(b){return new Promise(function(res){var r=new FileReader();r.onload=function(){res(r.result)};r.readAsDataURL(b)})}
async function withImages(){var im={};try{var ks=await imgKeys();for(var i=0;i<ks.length;i++){var b=await imgGet(ks[i]);if(b)im[ks[i]]=await blobToUrl(b)}}catch(e){}return Object.assign({},S,{images:im})}
async function hydrateImgs(){
  var els=document.querySelectorAll('img[data-bid]');
  for(var i=0;i<els.length;i++){var el=els[i],b=await imgGet(el.getAttribute('data-bid'));if(b)el.src=URL.createObjectURL(b)}
}
function saveFile(name,blob){
  return new Promise(function(res){
    var f=new File([blob],name,{type:blob.type||'application/octet-stream'}),u=URL.createObjectURL(blob);
    var d=document.createElement('div');d.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:100;display:flex;align-items:center;justify-content:center;padding:20px';
    var b=document.createElement('div');b.style.cssText='background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:14px;padding:16px;max-width:360px;width:100%;line-height:1.6';
    b.innerHTML='<div style="margin-bottom:12px">الملف جاهز ✅<br><span style="color:var(--mut);font-size:14px;word-break:break-all">'+esc(name)+'</span></div>';
    var row=document.createElement('div');row.className='row';
    var sh=document.createElement('button');sh.className='pri';sh.textContent='حفظ / مشاركة';
    sh.onclick=function(){if(navigator.canShare&&navigator.canShare({files:[f]})){navigator.share({files:[f]}).catch(function(){})}else{window.open(u,'_blank')}};
    var op=document.createElement('a');op.className='btn';op.textContent='فتح';op.href=u;op.target='_blank';op.rel='noopener';
    var cl=document.createElement('button');cl.textContent='إغلاق';cl.onclick=function(){d.remove();res()};
    row.appendChild(sh);row.appendChild(op);row.appendChild(cl);b.appendChild(row);d.appendChild(b);document.body.appendChild(d);
  });
}
var DL={save:function(o){return saveFile(o.filename,o.data)}};
function today(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function mins(t){var a=(t||'0:0').split(':');return (+a[0])*60+(+a[1]||0)}
function fmt(m){var h=Math.floor(m/60)%24,mm=m%60,ap=h>=12?'م':'ص',h12=h%12||12;return h12+':'+String(mm).padStart(2,'0')+' '+ap}
function byId(id){return S.customers.find(function(c){return c.id===id})}
function tab(n){acctId=null;entType=null;entPre=null;entBlob=null;editEntId=null;doneId=null;cur=n;editId=null;pendLoc=null;locTried=false;render()}

var geoMsg='';
function setMsg(m){geoMsg=m;var e=document.getElementById('gm');if(e)e.textContent=m}
function hav(a,b){var R=6371,r=Math.PI/180,dl=(b.lat-a.lat)*r,dn=(b.lng-a.lng)*r;var x=Math.sin(dl/2)*Math.sin(dl/2)+Math.cos(a.lat*r)*Math.cos(b.lat*r)*Math.sin(dn/2)*Math.sin(dn/2);return 2*R*Math.asin(Math.sqrt(x))}
function dist(a,b){if(a.lat!=null&&b.lat!=null)return hav(a,b);return (a.area&&a.area===b.area)?2:60}
function okGeo(c){return c.lat!=null&&(c.gps||c.gk===gkey(c))}
function gkey(c){return (c.address||'')+'|'+(c.area||'')}
function generate(){
  var t=today(),max=Math.max(1,+S.settings.max||7);
  var due=S.customers.filter(function(c){return c.last!==t});
  due.sort(function(a,b){return (a.last||'').localeCompare(b.last||'')});
  var ids=[];
  if(due.length){
    var seed=due[0],pool=due.slice(1);
    pool.sort(function(a,b){return dist(seed,a)-dist(seed,b)});
    var rest=pool.slice(0,max-1),route=[seed];
    while(rest.length){var l=route[route.length-1],bi=0;rest.forEach(function(c,i){if(dist(l,c)<dist(l,rest[bi]))bi=i});route.push(rest.splice(bi,1)[0])}
    ids=route.map(function(c){return c.id});
  }
  S.schedule={date:t,ids:ids};save();render();
}

function timeline(){
  var st=S.settings,dow=new Date().getDay(),fixedOn=dow<=4&&st.fixedName;
  var ids=S.schedule.date===today()?S.schedule.ids.filter(byId):[];
  var t=mins(st.start),fT=mins(st.fixedTime),fD=+st.fixedDur||60,vD=+st.visitDur||40,placed=false,out=[];
  ids.forEach(function(id){
    if(fixedOn&&!placed&&t+vD>fT){out.push({fixed:true,at:Math.max(t,fT)});t=Math.max(t,fT)+fD;placed=true}
    out.push({c:byId(id),at:t});t+=vD;
  });
  if(fixedOn&&!placed){out.push({fixed:true,at:fT})}
  out.sort(function(a,b){return a.at-b.at});
  var pv=null;out.forEach(function(x){if(x.c){if(pv&&pv.lat!=null&&x.c.lat!=null)x.km=hav(pv,x.c);pv=x.c}});
  return out;
}

function vToday(){
  var d=new Date(),dow=d.getDay(),h='';
  h+='<h1>جدول اليوم</h1><div class="sub">'+DAYS[dow]+' — '+d.toLocaleDateString('ar-EG')+(dow>4?' (إجازة)':'')+'</div>';
  h+='<button class="btn pri full" onclick="generate()">'+(S.schedule.date===today()?'🔄 اعمل جدول جديد':'✨ اعمل جدول النهارده')+'</button>';
  var tids=S.schedule.date===today()?S.schedule.ids.filter(byId):[];
  if(tids.length){
    var alld=tids.every(function(i){return byId(i).last===today()});
    h+=(alld?'<div class="sub">🎉 خلصت كل زيارات النهارده. اطلع التقرير:</div>':'')+'<button class="btn full'+(alld?' pri':'')+'" onclick="makePdf()">📄 اطلع تقرير اليوم PDF</button><div class="sub" id="pm">'+esc(pdfMsg)+'</div>';
  }
  if(!S.customers.length)return h+'<div class="empty">ضيف عملاء الأول من تبويب «العملاء».</div>';
  if(S.schedule.date!==today())return h+'<div class="empty">اضغط الزرار فوق عشان يتعمل جدول النهارده.</div>';
  var tl=timeline();
  if(!tl.length)return h+'<div class="empty">مفيش زيارات. ممكن كل العملاء اتزاروا النهارده 👏</div>';
  tl.forEach(function(x){
    if(x.fixed){h+='<div class="card fixed"><div class="row"><span class="time">'+fmt(x.at)+'</span><span class="nm">📌 '+esc(S.settings.fixedName)+'</span><span class="tag">مكان ثابت</span></div></div>';return}
    var c=x.c,dn=c.last===today();
    h+='<div class="card'+(dn?' done':'')+'"><div class="row"><span class="time">'+fmt(x.at)+'</span><span class="nm">'+esc(c.name)+'</span>'+(c.area?'<span class="tag">'+esc(c.area)+'</span>':'')+'</div>';
    h+='<div class="ad">'+esc(c.address)+'</div>'+(x.km!=null?'<div class="ad">🚗 حوالي '+(x.km<1?'أقل من 1':x.km.toFixed(1))+' كم من الزيارة السابقة</div>':'')+'<div class="row">';
    if(c.phone)h+='<a class="btn sm" href="tel:'+esc(c.phone)+'">📞 اتصال</a>';
    h+='<a class="btn sm" target="_blank" rel="noopener" href="https://maps.apple.com/?'+(c.gps?'ll='+c.lat+','+c.lng+'&q='+encodeURIComponent(c.name):'q='+encodeURIComponent((c.address||c.name)+' '+(c.area||'')))+'">🗺️ الخريطة</a>';
    h+='<button class="sm" onclick="openAcct(\''+c.id+'\')">🧾 الحساب</button>';
    if(dn)h+='<button class="sm" onclick="openDone(\''+c.id+'\')">✏️ تعديل</button><button class="sm" onclick="toggleDone(\''+c.id+'\')">↩️ إلغاء</button>';
    else h+='<button class="sm pri" onclick="openDone(\''+c.id+'\')">✅ تمت الزيارة</button>';
    h+='</div>';
    var lg=(S.log[today()]||{})[c.id];
    var bl=bal(c.id);if(bl!==0||hasLedger(c.id))h+='<div class="ad">'+(bl>0?'💳 عليه مديونية: '+money(bl):bl<0?'له رصيد: '+money(-bl):'✅ حسابه خالص')+'</div>';
    if(dn&&lg)h+='<div class="ad">👤 '+esc(lg.contact)+(lg.pos?' ('+esc(lg.pos)+')':'')+(lg.note?' — '+esc(lg.note):'')+'</div>';
    if(doneId===c.id)h+='<div style="margin-top:8px"><label>اسم المسؤول اللي قابلته</label><input id="dc" value="'+esc((lg&&lg.contact)||c.contact||'')+'"><label>وظيفته</label><input id="dp" value="'+esc((lg&&lg.pos)||c.position||'')+'"><label>عملت إيه في الزيارة؟</label><textarea id="dn" rows="3">'+esc(lg?lg.note:'')+'</textarea><div class="row"><button class="pri" onclick="saveDone(\''+c.id+'\')">حفظ</button><button onclick="doneId=null;render()">إلغاء</button></div></div>';
    h+='</div>';
  });
  return h;
}
function money(n){var c=S.settings.currency||'';return (Math.round(n*1000)/1000).toLocaleString('en-US',{maximumFractionDigits:3})+(c?' '+c:'')}
function bal(cid){var b=0;S.ledger.forEach(function(e){if(e.cid===cid)b+=e.type==='pay'?-e.amount:e.amount});return Math.round(b*1000)/1000}
function hasLedger(cid){return S.ledger.some(function(e){return e.cid===cid})}
function openAcct(id){stmtFrom='';stmtTo='';acctId=id;entType=null;editId=null;render();window.scrollTo(0,0)}
function stText(b){return b>0?'عليه مديونية '+money(b):b<0?'له رصيد '+money(-b):'حسابه خالص ✅'}
function vAcct(){
  var c=byId(acctId);if(!c){acctId=null;return vToday()}
  var pre=entPre||{};var b=bal(c.id),h='<button class="sm" onclick="acctId=null;entType=null;entPre=null;render()">→ رجوع</button><h1 style="margin-top:12px">'+esc(c.name)+'</h1>';
  h+='<div class="card" style="text-align:center"><div class="sub">الرصيد الحالي</div><div style="font-size:24px;font-weight:700;color:'+(b>0?'#d9534f':'var(--pr)')+'">'+stText(b)+'</div></div>';
  var dl=dueList(c.id);
  if(dl.length){h+='<div class="card"><div class="nm" style="margin-bottom:6px">كشف المديونية</div>';dl.forEach(function(d){h+='<div class="row" style="justify-content:space-between"><span>'+(d.o.type==='open'?'مديونية سابقة':d.o.inv?'فاتورة '+esc(d.o.inv):'أوردر')+' · '+esc(d.o.date)+'</span><b style="color:#d9534f">'+money(d.rem)+(d.rem<d.o.amount?' من '+money(d.o.amount):'')+'</b></div>'});h+='<div class="ad">الدفعات بتتخصم من الأقدم للأحدث.</div></div>'}
  h+='<div class="row" style="margin-bottom:10px"><button class="pri" onclick="entPre=null;entBlob=null;entType=\'order\';render()">➕ أوردر جديد</button><button onclick="entPre=null;entBlob=null;entType=\'pay\';render()">💵 تسجيل دفعة</button><button onclick="entPre=null;entBlob=null;entType=\'open\';render()">📒 مديونية سابقة</button><button onclick="document.getElementById(\'invf\').click()">📷 صورة فاتورة</button></div><input id="invf" type="file" accept="image/jpeg,image/png,image/webp" style="display:none" onchange="attachInvoice(this)"><div class="sub" id="im">'+esc(invMsg)+'</div>';
  h+=rangeCard();
  if(entType){
    h+='<div class="card"><div class="nm" style="margin-bottom:8px">'+(entType==='order'?'أوردر جديد':entType==='open'?'مديونية سابقة (رصيد افتتاحي)':'دفعة مستلمة')+'</div><label>المبلغ'+(S.settings.currency?' ('+esc(S.settings.currency)+')':'')+'</label><input id="ea" type="number" inputmode="decimal" step="any" value="'+esc(pre.amount||'')+'">'+(entType==='order'?'<label>رقم الفاتورة (اختياري)</label><input id="ei" value="'+esc(pre.inv||'')+'">':'')+'<label>بيان (اختياري)</label><input id="en" placeholder="ملاحظة" value="'+esc(pre.note||'')+'"><label>التاريخ</label><input id="ed" type="date" value="'+(pre.date||today())+'">'+(pre.date?'<div class="sub">📅 '+(pre.dtxt?'اتقرا من الفاتورة: '+esc(pre.dtxt)+' ← ':'')+'هتتسجل في مبيعات '+mname(pre.date)+'</div>':'')+(entType!=='open'?'<label>'+(entType==='pay'?'📎 صورة إيصال الدفع / التحويل (بتتحفظ مع الحركة)':'📎 صورة الفاتورة (بتتحفظ مع الحركة)')+'</label><input id="ep" type="file" accept="image/jpeg,image/png,image/webp" onchange="pickImg(this)"><div class="sub" id="pi">'+(entBlob?'تم اختيار صورة ✅':'')+'</div>':'')+(entType!=='open'?'<label>📋 أو الصق نص '+(entType==='pay'?'الإيصال':'الفاتورة')+' (مجاني ومن غير حدود)</label><textarea id="et" rows="3" placeholder="انسخ النص من الفاتورة أو من الصورة بخاصية Live Text وألصقه هنا" onchange="parseText(this.value)" onpaste="var t=this;setTimeout(function(){parseText(t.value)},60)"></textarea><div class="sub" id="pt"></div>':'')+'<div class="row"><button class="pri" onclick="saveEnt()">حفظ</button><button onclick="entType=null;entBlob=null;render()">إلغاء</button></div></div>';
  }
  var es=S.ledger.filter(function(e){return e.cid===c.id}).sort(function(a,b){return (b.date||'').localeCompare(a.date||'')||b.id.localeCompare(a.id)});

async function useLoc(){
  if(!navigator.geolocation){setLm('المتصفح ده مش بيدعم تحديد الموقع.');return}
  setLm('جاري تحديد موقعك…');
  var pos;
  try{pos=await new Promise(function(ok,no){navigator.geolocation.getCurrentPosition(ok,no,{enableHighAccuracy:true,timeout:15000,maximumAge:0})})}
  catch(e){setLm(e&&e.code===1?'الموقع مش مسموح للصفحة دي. ممكن تلصق الإحداثيات في الخانة اللي تحت بدل الزرار.':'تعذر تحديد موقعك. جرّب تاني، أو الصق الإحداثيات في الخانة اللي تحت.');return}
  return applyLoc(pos.coords.latitude,pos.coords.longitude);
}
function pasteLoc(v){
  v=String(v||'').replace(/[٠-٩]/g,function(d){return '٠١٢٣٤٥٦٧٨٩'.indexOf(d)});
  var re=/(\d{1,3})\s*[°º]\s*(\d{1,2})\s*['′’‘]\s*(\d{1,2}(?:\.\d+)?)\s*(?:["″”“]|'')?\s*([NSEWnsew])/g,x,la0=null,ln0=null;
  while((x=re.exec(v))){var val=(+x[1])+(+x[2])/60+(+x[3])/3600,L=x[4].toUpperCase();if(L==='S'||L==='W')val=-val;if(L==='N'||L==='S')la0=val;else ln0=val}
  if(la0!==null&&ln0!==null){if(Math.abs(la0)>90||Math.abs(ln0)>180){setLm('الإحداثيات دي غير صحيحة.');return}applyLoc(la0,ln0);return}
  var m=v.match(/(-?\d{1,3}\.\d+)\s*[,،;\s]\s*(-?\d{1,3}\.\d+)/);
  if(!m){setLm('مش لاقي إحداثيات. الصق رابط خرائط فيه أرقام، أو إحداثيات زي 29.37589, 47.97742');return}
  var la=parseFloat(m[1]),ln=parseFloat(m[2]);
  if(Math.abs(la)>90||Math.abs(ln)>180){setLm('الإحداثيات دي غير صحيحة.');return}
  applyLoc(la,ln);
}
function applyLoc(la,ln){
  pendLoc={lat:la,lng:ln,zone:''};
  setLm('📍 تم أخذ الإحداثيات ('+la.toFixed(5)+', '+ln.toFixed(5)+'). اكتب العنوان واسم المنطقة بإيدك.');
}
